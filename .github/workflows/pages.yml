name: Publish research workbench
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 12:30 Beijing, after the daily literature brief's 10:00 run.
    - cron: '30 4 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install -g pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Sync public literature reports
        run: node scripts/sync-literature.mjs
      - run: pnpm test
      - run: pnpm build:static
      - name: Preserve refreshed public catalog
        run: |
          if ! git diff --quiet -- catalog.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add catalog.json
            git commit -m "Sync daily literature catalog"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-static
      - id: deployment
        uses: actions/deploy-pages@v5
